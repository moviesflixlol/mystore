name: Build mystore APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystore-v1.0.3-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.3
          name: mystore v1.0.3 (Official Release)
          body: |
            ## mystore — Android App Store (Release v1.0.3)

            - **In-App Package Installer (No External Redirects)**: Native background downloader with direct in-app package installer handoff using `FileProvider` and `ACTION_VIEW` (`application/vnd.android.package-archive`).
            - **Real System Download Notifications**: Download progress updates in the notification shade with byte counter and percentage, using the store's red M logo.
            - **Notification Permission & Runtime Permissions**: Full support for Android 13+ `POST_NOTIFICATIONS`, `REQUEST_INSTALL_PACKAGES`, `QUERY_ALL_PACKAGES`, and foreground services.
            - **Dedicated "No Network" Offline Page**: Automatic connection monitoring with modern offline screen and instant "Try Again" retry action.
            - **Local Metadata Caching**: Persistent offline/instant caching for home feeds, category rankings, and visited applications for zero-wait 0ms navigation.
            - **Clean & Fast**: Compact ~5 MB signed APK.

            Download the attached `app-release.apk` below and install directly on your Android device.
          files: app/build/outputs/apk/release/*.apk
