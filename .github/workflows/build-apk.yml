name: Build mystore APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystore-v1.0.2-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.2
          name: mystore v1.0.2 (Official Release)
          body: |
            ## mystore — Android App Store (Release v1.0.2)

            - **App Header Logo Guaranteed**: Integrated base64 data URI fallback + multi-route `WebViewAssetLoader` (zero broken images).
            - **CORS & "Failed to fetch" Fully Resolved**: Direct Java `HttpURLConnection` native fetch bridge + `shouldInterceptRequest` proxy (100% immune to Cloudflare/CORS blocks).
            - **Real Updates Only**: Eliminated all mock/sample apps. Real device `PackageManager` inspection and verified API update tracking.
            - **Package Name**: `com.mystore.movieflix`
            - **Adaptive Launcher Icons**: Centered 108dp safe-zone layered icons for modern Android 8–14+ launchers.
            - **Fast & Compact**: (~5 MB) native APK build.

            Download the attached `app-release.apk` below and install directly on your Android device.
          files: app/build/outputs/apk/release/*.apk
