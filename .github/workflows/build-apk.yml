name: Build Nuratix Store APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystore-v1.0.1-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.1
          name: mystore v1.0.1 (Official Release)
          body: |
            ## mystore — Android App Store (Release v1.0.1)

            - **Package Name**: `com.mystore.movieflix`
            - **Adaptive Launcher Icons**: Full support for Android 8 - 14+ adaptive icons
            - **CORS & Network Fix**: Modern `WebViewAssetLoader` with 0ms load and no 401 errors
            - **Lightweight APK** (~5 MB): No bloated 300MB Chromium binaries
            - **Split APK & Package Installer Support**: Circular progress download bar and native installer handoff
            - **Automated Update Manager**: In-app package tracking & update checks

            Download the attached `app-release.apk` below and install it directly on your Android device.
          files: app/build/outputs/apk/release/*.apk
