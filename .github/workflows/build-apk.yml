name: Build mystore APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mystore-v1.0.4-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.4
          name: mystore v1.0.4 (Official Release)
          body: |
            ## mystore — Android App Store (Release v1.0.4)

            - **Custom In-App Package Installer**: Own installer sheet powered by Android `PackageInstaller.Session` — completely independent from phone defaults.
            - **Official Share Links**: Share apps & developer pages using domain `https://mystore.movieflix.lol/` via Android native share sheet.
            - **Verified Company Badge**: Sleek, modern verified publisher badge on company pages.
            - **Video Support**: Integrated inline video player and trailer support for applications and games.
            - **Pull to Refresh**: Smooth `SwipeRefreshLayout` with brand red spinner.
            - **Installed App Lifecycle**: Detects installed applications on the device — shows "Open" & "Uninstall" or "Update" & "Uninstall" instead of downloading again.
            - **Guaranteed No Network Page**: Dedicated offline screen with auto-reconnection and instant retry.

            Download the attached `app-release.apk` below and install directly on your Android device.
          files: app/build/outputs/apk/release/*.apk
